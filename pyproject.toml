[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-configurator"
version = "0.1.0"
description = "Langflow blocks and hand-off service that build agents on LLMs from the coworkAI LLM Configurator"
requires-python = ">=3.10,<3.14"
dependencies = [
    "httpx>=0.27",
    "langchain-core>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
